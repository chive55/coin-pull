<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Coin Pull</title>
  <meta name="description" content="Hold to move. Eat the lime coins. Red ends the run.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #07080f; overflow: hidden;
      font-family: ui-sans-serif, system-ui, sans-serif; touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #eef2ff;
    }
    #score {
      font-variant-numeric: tabular-nums; letter-spacing: 0.14em;
      font-weight: 700; font-size: 22px; text-shadow: 0 0 18px #7cff6b88;
    }
    #panel {
      pointer-events: auto; text-align: center; background: #0b0d18ee;
      border: 1px solid #7cff6b33; border-radius: 16px; padding: 24px 28px; max-width: 420px;
    }
    #panel h1 { margin: 0 0 8px; letter-spacing: 0.18em; font-size: 28px; }
    #panel p { margin: 0 0 16px; color: #b7c0e0; line-height: 1.45; }
    button {
      min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px;
      background: #7cff6b; color: #0b0c14; font-weight: 800; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="panel">
      <h1>COIN PULL</h1>
      <p id="blurb">Hold to move. Eat the lime. Red ends the run.</p>
      <p>Best: <span id="best">0</span></p>
      <button id="go" type="button">Play</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const panel = document.getElementById("panel");
    const go = document.getElementById("go");
    const blurb = document.getElementById("blurb");
    const KEY = "coin-pull-best";

    function loadBest() {
      try { return Math.max(0, Number(localStorage.getItem(KEY)) || 0); } catch (e) { return 0; }
    }
    function saveBest(n) {
      try { localStorage.setItem(KEY, String(n)); } catch (e) {}
    }

    let W = 0, H = 0, dpr = 1;
    let running = false, dead = false, holding = false;
    let score = 0, best = loadBest(), t = 0;
    document.getElementById("best").textContent = String(best);

    const player = { x: 0, y: 0, r: 16, tx: 0, ty: 0 };
    let coins = [];
    let drones = [];
    let parts = [];

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth;
      H = innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    function rnd(a, b) { return a + Math.random() * (b - a); }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function farFromPlayer() {
      let x, y, n = 0;
      do {
        x = rnd(28, W - 28);
        y = rnd(72, H - 28);
        n++;
      } while (Math.hypot(x - player.x, y - player.y) < 90 && n < 20);
      return { x, y };
    }

    function addCoin() {
      const p = farFromPlayer();
      coins.push({ x: p.x, y: p.y, r: 9, w: Math.random() * 6 });
    }

    function addDrone() {
      const side = Math.floor(Math.random() * 4);
      const e = { r: 13, s: 46 + score * 3.2 };
      if (side === 0) { e.x = -20; e.y = rnd(80, H - 20); }
      else if (side === 1) { e.x = W + 20; e.y = rnd(80, H - 20); }
      else if (side === 2) { e.x = rnd(20, W - 20); e.y = -20; }
      else { e.x = rnd(20, W - 20); e.y = H + 20; }
      drones.push(e);
    }

    function burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = rnd(40, 180);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.25, 0.7), color });
      }
    }

    function resetRun() {
      score = 0;
      t = 0;
      dead = false;
      holding = false;
      player.x = W * 0.5;
      player.y = H * 0.58;
      player.tx = player.x;
      player.ty = player.y;
      coins = [];
      drones = [];
      parts = [];
      for (let i = 0; i < 4; i++) addCoin();
      addDrone();
      scoreEl.textContent = "0";
    }

    function start() {
      resetRun();
      running = true;
      panel.classList.add("hidden");
    }

    function die() {
      dead = true;
      running = false;
      holding = false;
      if (score > best) {
        best = score;
        saveBest(best);
        document.getElementById("best").textContent = String(best);
      }
      blurb.textContent = score === 0
        ? "Hold to move. Eat the lime. Red ends the run."
        : "Pulled " + score + " coin" + (score === 1 ? "" : "s") + ".";
      go.textContent = "Again";
      panel.classList.remove("hidden");
    }

    function aim(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      player.tx = (clientX - r.left) * (W / r.width);
      player.ty = (clientY - r.top) * (H / r.height);
    }

    function onDown(e) {
      e.preventDefault();
      if (!running) return;
      holding = true;
      const p = e.touches ? e.touches[0] : e;
      aim(p.clientX, p.clientY);
    }
    function onMove(e) {
      if (!holding || !running) return;
      const p = e.touches ? e.touches[0] : e;
      aim(p.clientX, p.clientY);
    }
    function onUp() { holding = false; }

    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    addEventListener("pointerup", onUp);
    addEventListener("pointercancel", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp);
    go.addEventListener("click", start);

    addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (!running) start();
      }
    });

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      t += dt;

      if (running && !dead) {
        if (holding) {
          const dx = player.tx - player.x;
          const dy = player.ty - player.y;
          const m = Math.hypot(dx, dy);
          const speed = 340;
          if (m > 2) {
            player.x += (dx / m) * Math.min(m, speed * dt);
            player.y += (dy / m) * Math.min(m, speed * dt);
          }
        }
        player.x = Math.max(player.r, Math.min(W - player.r, player.x));
        player.y = Math.max(player.r + 48, Math.min(H - player.r, player.y));

        if (coins.length < 4 + Math.min(3, Math.floor(score / 8))) addCoin();
        const wantDrones = 1 + Math.floor(score / 6);
        if (drones.length < Math.min(4, wantDrones) && Math.random() < dt * 0.55) addDrone();

        for (let i = coins.length - 1; i >= 0; i--) {
          const q = coins[i];
          q.w += dt * 4;
          if (dist(player, q) < player.r + q.r) {
            coins.splice(i, 1);
            score++;
            scoreEl.textContent = String(score);
            burst(q.x, q.y, "#7cff6b", 14);
          }
        }

        for (const e of drones) {
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          e.s = 50 + score * 3.4;
          e.x += Math.cos(a) * e.s * dt;
          e.y += Math.sin(a) * e.s * dt;
          if (dist(player, e) < player.r + e.r - 2) {
            burst(player.x, player.y, "#ff4d68", 22);
            die();
            break;
          }
        }
      }

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) parts.splice(i, 1);
      }

      ctx.fillStyle = "#07080f";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(124,255,107,0.05)";
      ctx.lineWidth = 1;
      const gap = 36;
      for (let x = 0; x < W; x += gap) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += gap) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      for (const q of coins) {
        const pulse = 1 + 0.08 * Math.sin(q.w);
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.shadowBlur = 16;
        ctx.shadowColor = "#7cff6b";
        ctx.fillStyle = "#7cff6b";
        ctx.beginPath();
        ctx.arc(0, 0, q.r * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#d8ffc8";
        ctx.beginPath();
        ctx.arc(-2.5, -2.5, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const e of drones) {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(a);
        ctx.shadowBlur = 14;
        ctx.shadowColor = "#ff4d68";
        ctx.fillStyle = "#ff4d68";
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-10, -9);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-10, 9);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#2a0710";
        ctx.beginPath();
        ctx.arc(2, 0, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowBlur = 22;
      ctx.shadowColor = "#7cff6b";
      ctx.fillStyle = holding ? "#7cff6b" : "#4aa84a";
      ctx.beginPath();
      ctx.arc(0, 0, player.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#07080f";
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (const p of parts) {
        ctx.globalAlpha = Math.max(0, p.life * 1.4);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
